[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shraddha-backend"
version = "0.2.0"
description = "Flask-based secure provider gateway for Cineflix Shraddha"
requires-python = ">=3.10"
dependencies = [
  "Flask>=3.0,<4.0",
  "Flask-Cors>=4.0,<6.0",
  "gunicorn>=22.0,<24.0",
  "httpx>=0.27,<1.0",
  "python-dotenv>=1.0,<2.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
